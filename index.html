<style>

    g.lineTo(b[0] - Math.cos(ang + 0.4) * 12 * sc, b[1] - Math.sin(ang + 0.4) * 12 * sc); g.closePath(); g.fill();
    if (r.label) { // raid plaque, as pushed around the plotting table
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      g.font = `700 ${Math.round(12 * sc)}px "Barlow Condensed", sans-serif`;
      const tw = g.measureText(r.label).width + 10;
      g.fillStyle = '#efe6cf'; g.fillRect(mx - tw / 2, my - 9 * sc, tw, 18 * sc);
      g.strokeStyle = r.color || '#b3262c'; g.lineWidth = 1.5; g.strokeRect(mx - tw / 2, my - 9 * sc, tw, 18 * sc);
      g.fillStyle = '#1c1b18'; g.fillText(r.label, mx - tw / 2 + 5, my + 4 * sc);
    }
  }
  // aircraft
  for (const p of opts.planes || []) {
    const q = P(p.x, p.z);
    g.save(); g.translate(q[0], q[1]); g.rotate(p.heading || 0);
    g.fillStyle = p.color; g.strokeStyle = 'rgba(0,0,0,.6)'; g.lineWidth = 1;
    const s = (p.player ? 7 : 4.5) * sc;
    g.beginPath(); g.moveTo(0, -s); g.lineTo(s * 0.7, s); g.lineTo(0, s * 0.5); g.lineTo(-s * 0.7, s); g.closePath(); g.fill(); g.stroke();
    g.restore();
  }
  // compass rose
  g.save(); g.translate(W - 30 * sc, 34 * sc); g.strokeStyle = '#2b2a24'; g.fillStyle = '#2b2a24'; g.lineWidth = 1.5;
  g.beginPath(); g.arc(0, 0, 16 * sc, 0, 7); g.stroke(); g.beginPath(); g.moveTo(0, -14 * sc); g.lineTo(4 * sc, 0); g.lineTo(-4 * sc, 0); g.closePath(); g.fill();
  g.font = `700 ${Math.round(11 * sc)}px "Barlow Condensed", sans-serif`; g.fillText('S', -3 * sc, -19 * sc); g.restore();
  // scale bar 10 km
  const px10 = 10000 / WORLD.w * W;
  g.fillStyle = '#2b2a24'; g.fillRect(14 * sc, H - 18 * sc, px10, 3 * sc);
  g.font = `600 ${Math.round(11 * sc)}px "Barlow Condensed", sans-serif`; g.fillText('10 km', 14 * sc, H - 24 * sc);
}

    }
    // squadron chatter that concerns you
    if (pl.state === 'fly' && Math.floor(W.time * 2) !== Math.floor((W.time - dt) * 2)) {
      const mates = W.planes.filter((m) => m !== pl && m.alive && m.side === pl.side && m.group === pl.group);
      const caller = mates[0];
      if (caller && W.time - this.radioT.brk > 14) {
        for (const e of W.planes) {
          if (!e.alive || e.side === pl.side || isBomberKey(e.key)) continue;
          const d = e.pos.distanceTo(pl.pos); if (d > 650) continue;
          e.fwd(_v1); _v2.copy(pl.pos).sub(e.pos).normalize(); if (_v1.dot(_v2) < 0.94) continue;
          pl.toLocal(e.pos, _v3); if (_v3.z < 0) continue;
          HUD.msg(`${caller.name}: ${pl.name}, break ${_v3.x < 0 ? 'left' : 'right'}! ${e.spec.short} ti sedí na ocase!`, 'radio'); this.radioT.brk = W.time; break;
        }
      }
      if (caller && !this.radioT.smoke && (pl.engineDamage() > 0.45 || pl.fire > 0)) { this.radioT.smoke = true; HUD.msg(`${caller.name}: ${pl.name}, ${pl.fire > 0 ? 'hoříš' : 'kouříš'}! ${pl.side === 'RAF' ? 'Zamiř domů.' : 'Zpátky přes Kanál!'}`, 'radio'); }
    }
    if (pl.state === 'fall' && !pl.bailed && pl.pilotKilled) { setTimeoutGame(4, () => this.finish()); this.ending = true; return; }
    // action over?
    if (!this.doneAnnounced && W.time > 30) {
      const enemiesNear = W.planes.some((e) => e.alive && e.side !== pl.side && e.pos.distanceTo(pl.pos) < 7000);
      const raidActive = this.raid.some((b) => b.alive && !(b.ai && (b.ai.mode === 'rtb' || b.ai.goingHome)) && !(b.isPlayer && b.bombs.length === 0));
      const anyEnemy = W.planes.some((e) => e.alive && e.side !== pl.side);
      if ((!enemiesNear && !raidActive) || !anyEnemy || W.time > 900) {
        this.doneAnnounced = true;
        HUD.msg(`Akce skončila. Stiskni N pro let domů na ${this.home ? this.home.def.name : 'základnu'} a přistaň, nebo misi ukonči (Esc).`, 'ok');
      }
    }
    if (this.spec.wp && !this.wpDone && Math.hypot(pl.pos.x - this.spec.wp.x, pl.pos.z - this.spec.wp.z) < 2500) { this.wpDone = true; HUD.msg(this.spec.wp.msg || 'Úkol splněn. Vrať se domů.', 'ok'); }
    const out = pl.pos.x < WORLD.minX - 2000 || pl.pos.x > WORLD.maxX + 2000 || pl.pos.z < WORLD.minZ - 2000 || pl.pos.z > WORLD.maxZ + 2000;
    if (out) { HUD.msg('Opustil jsi prostor operace.', 'ok'); this.finish(); }
  },
  fate() {
    const p = W.player; const side = p.side;
    const enemyLand = (x, z) => { const d = landD(x, z); if (d <= 0) return false; return ownerAt(x, z) !== side; };
    const nearEnemyCoast = (x, z) => (TH.inland ? false : side === 'RAF' ? z > coastF(x) - 5000 && ownerAt(x, coastF(x) + 2000) !== 'RAF' : z < coastE(x) + 5000);
    const wounded = p.wounded > 0.3;
    let f = 'OK', text = '', sc = 'return', severe = false;
    const how = this.playerOut ? this.playerOut.how : 'air';
    // death only when there is really no way out: most hits on the pilot, explosions and fires end in hospital instead
    const survive = (why) => {
      const x = p.pos.x, z = p.pos.z, sea0 = landD(x, z) <= 0;
      severe = true;
      if (sea0) {
        if (nearEnemyCoast(x, z) && chance(0.6)) return { f: 'POW', text: why + ' Raněného ho z moře vytáhl nepřátelský člun. Zajat.', sc: 'pow_sea' };
        if (chance(0.9)) return { f: 'WIA', text: why + (side === 'RAF' ? ' Z moře ho vylovil záchranný člun, podchlazeného a raněného.' : ' Vylovil ho hydroplán Seenotdienstu, raněného a podchlazeného.'), sc: 'rescue_sea' };
        return { f: 'MIA', text: why + ' Nezvěstný nad mořem.', sc: 'mia' };
      }
      if (enemyLand(x, z)) return { f: 'POW', text: why + ' Raněného ho našla nepřátelská hlídka. Zajat.', sc: 'pow_land' };
      return { f: 'WIA', text: why + ' Odvezli ho do nemocnice.', sc: 'wia' };
    };
    const use = (o) => { f = o.f; text = o.text; sc = o.sc; };
    if (p.pilotKilled) { if (chance(0.88)) use(survive('Těžce raněn, na chvíli ztratil vědomí. Probral se v padajícím stroji a na poslední chvíli vyskočil.')); else { f = 'KIA'; text = 'Padl v boji.'; sc = 'kia'; } }
    else if (how === 'exploded') { if (chance(0.75)) use(survive('Výbuch ho vymrštil z kabiny. Padák se otevřel sám, když se zachytil o trosky.')); else { f = 'KIA'; text = 'Zahynul při výbuchu letounu.'; sc = 'kia'; } }
    else if (how === 'crashed') { f = 'KIA'; text = 'Zahynul při nárazu do země.'; sc = 'kia'; }
    else if (how === 'bailed') {
      const ch = W.chutes.find((c) => c.player);
      const x = ch ? ch.pos.x : p.pos.x, z = ch ? ch.pos.z : p.pos.z;
      if (ch && ch.splat) { if (chance(0.5)) { f = 'WIA'; severe = true; text = 'Padák se otevřel pozdě. Tvrdý dopad, zlomené obě nohy.'; sc = 'wia'; } else { f = 'KIA'; text = 'Padák se neotevřel včas.'; sc = 'kia'; } }
      else if (landD(x, z) <= 0) {
        if (nearEnemyCoast(x, z) && chance(0.6)) { f = 'POW'; text = 'Vyloven z moře nepřátelským člunem. Zajat.'; sc = 'pow_sea'; }
        else if (chance(side === 'RAF' ? 0.6 : 0.72)) { f = 'OK'; text = side === 'RAF' ? 'Vyloven záchranným člunem po hodinách v moři.' : 'Vyloven hydroplánem Seenotdienstu.'; sc = 'rescue_sea'; }
        else if (chance(0.7)) { f = 'WIA'; severe = chance(0.5); text = 'Hodiny ve studeném moři. Vyloven v bezvědomí, s podchlazením.'; sc = 'rescue_sea'; }
        else { f = 'MIA'; text = 'Nezvěstný nad mořem.'; sc = 'mia'; }
      } else if (enemyLand(x, z)) { if (side === 'RAF' && !wounded && chance(0.6)) { f = 'EVADE'; text = `Přistál na padáku ${evadeWhere()}. Zatím ho nikdo neviděl.`; sc = 'evade'; } else { f = 'POW'; text = 'Přistál na padáku na nepřátelském území. Zajat.'; sc = 'pow_land'; } }
      else { f = 'OK'; text = 'Přistál na padáku na vlastním území.'; sc = 'chute_home'; }
    } else if (how === 'ditched') {
      if (nearEnemyCoast(p.pos.x, p.pos.z) && chance(0.6)) { f = 'POW'; text = 'Nouzově přistál do moře, zajat nepřítelem.'; sc = 'pow_sea'; }
      else if (chance(0.72)) { f = 'OK'; text = 'Nouzově přistál do moře a byl zachráněn.'; sc = 'rescue_sea'; }
      else if (chance(0.7)) { f = 'WIA'; severe = chance(0.5); text = 'Nouzově přistál do moře, po hodinách ve vodě vyloven s podchlazením.'; sc = 'rescue_sea'; }
      else { f = 'MIA'; text = 'Nouzově přistál do moře. Nezvěstný.'; sc = 'mia'; }
    } else if (how === 'belly') {
      if (enemyLand(p.pos.x, p.pos.z)) { if (side === 'RAF' && !wounded && chance(0.45)) { f = 'EVADE'; text = `Nouzově přistál ${evadeWhere()} a utekl od stroje do lesa.`; sc = 'evade'; } else { f = 'POW'; text = 'Nouzově přistál za nepřátelskou linií. Zajat.'; sc = 'pow_land'; } }
      else { f = 'OK'; text = 'Nouzově přistál na břicho na vlastním území.'; sc = 'belly'; }
    } else if (how === 'landed') { f = 'OK'; text = 'Bezpečně přistál na domovském letišti.'; sc = 'landed'; }
    else {
      if (enemyLand(p.pos.x, p.pos.z) && (p.enginePower() < 0.4 || p.fire > 0)) { f = 'POW'; text = 'Poškozený stroj nedoletěl domů. Zajat.'; sc = 'pow_land'; }
      else if (p.fire > 0) { if (chance(0.9)) { f = 'WIA'; severe = chance(0.5); text = 'S hořícím strojem nouzově přistál a vyskočil z kabiny s popáleninami.'; sc = 'belly'; } else { f = 'KIA'; text = 'Hořící stroj se zřítil při návratu.'; sc = 'kia'; } }
      else { f = 'OK'; text = 'Vrátil se na základnu.'; sc = 'return'; }
    }
    if (f === 'OK' && wounded) { f = 'WIA'; text += ' Zraněn.'; sc = 'wia'; }
    const sea = landD(p.pos.x, p.pos.z) <= 0;
    return { f, text, sc, sea, severe };
  },
  finish() {
    if (this.result) return;
    this.ending = true;
    const s = this.stats, pl = W.player, spec = this.spec;
    const gt = this.gt;
    const dmg = gt ? Math.max(0, targetDamage(gt) - s.dmg0) : 0;
    // claims: destroyed / shared from the shoot-downs, probable / damaged for aircraft that got away
    for (const e of W.planes) {
      if (e.side === pl.side || e.downed || !e.dmgBy || !e.dmgBy.get(pl)) continue;
      const mine = e.dmgBy.get(pl), hpTot = Object.values(e.hpMax).reduce((a, b) => a + b, 0), fr = mine / hpTot;
      const crippled = e.totalHealth() < 0.55 || e.fire > 0 || e.enginePower() < 0.4 || e.state === 'fall';
      if (fr >= 0.12 && crippled) s.claims.push({ key: e.key, side: e.side, kind: 'probable' });
      else if (fr >= 0.05) s.claims.push({ key: e.key, side: e.side, kind: 'damaged' });
    }
    const claimKeys = (k) => s.claims.filter((c) => c.kind === k && c.side !== pl.side).map((c) => c.key);
    const pkills = s.claims.filter((c) => c.kind === 'destroyed' && c.side !== pl.side);
    const enemy = pl.side === 'RAF' ? 'LW' : 'RAF';
    const raidLost = this.raid.filter((b) => b.downed).length;
    const raidN = Math.max(1, this.stats.raidStart);
    let ok = false, verdict = '';
    const raidOver = !this.raid.some((b) => b.alive && !(b.ai && (b.ai.mode === 'rtb' || b.ai.goingHome || b.ai.released)) && b.bombs.length > 0);
    switch (spec.objective) {
      case 'intercept':
        ok = raidLost / raidN >= 0.35 || (raidOver && dmg < 0.22);
        verdict = ok ? 'Nálet byl odražen.' : raidOver ? 'Bombardéry dosáhly cíle.' : 'Mise skončila dřív, než byl nálet zastaven.';
        break;
      case 'bomb': ok = dmg >= 0.22; verdict = ok ? 'Cíl byl těžce poškozen.' : 'Cíl nebyl dostatečně zasažen.'; break;
      case 'escort': ok = dmg >= 0.18 && raidLost / raidN <= 0.34; verdict = ok ? 'Bombardéry splnily úkol a ztráty byly přijatelné.' : (dmg < 0.2 ? 'Nálet nezasáhl cíl.' : 'Doprovod nedokázal bombardéry ochránit.'); break;
      case 'protect': { const n = this.protect.length || 1, alive = this.protect.filter((b) => !b.downed).length; ok = alive / n >= 0.5; verdict = ok ? 'Doprovázené letouny se vrátily.' : 'Doprovázené letouny jsme neubránili.'; break; }
      case 'hunt': { const n = this.hunt.length || 1, dn = this.hunt.filter((b) => b.downed).length; ok = dn / n >= 0.5; const v1 = this.hunt.some((b) => b.key === 'v1'); verdict = v1 ? (ok ? `Sestřeleno ${dn} z ${n} létajících pum.` : `Jen ${dn} z ${n} létajících pum sestřeleno, ostatní letí na Londýn.`) : spec.huntWhat ? (ok ? `Sestřeleno ${dn} z ${n} ${spec.huntWhat}.` : `Uniklo ${n - dn} z ${n} ${spec.huntWhat}.`) : ok ? 'Průzkumník nepřítele byl sestřelen.' : 'Průzkumník unikl.'; break; }
      case 'courier': ok = this.wpDone; verdict = ok ? 'Hlášení bylo doručeno.' : 'Hlášení nedošlo.'; break;
      case 'sweep': ok = s.losses[enemy] >= s.losses[pl.side]; verdict = ok ? 'Vybojovali jste převahu ve vzduchu.' : 'Nepřítel měl navrch.'; break;
      case 'free': ok = !W.planes.some((e) => e.alive && e.side === enemy); verdict = ok ? 'Nebe je čisté.' : 'Souboj nebyl rozhodnut.'; break;
      case 'gunnery': { const n = pkills.length + claimKeys('shared').length * 0.5; ok = n >= 2; verdict = `Zničeno ${n} cvičných cílů.`; break; }
      case 'bombing': { const nb = s.bombNear.length; const avg = nb ? s.bombNear.reduce((a, b) => a + b, 0) / nb : 0; ok = nb > 0 && avg < 300; verdict = nb ? `Průměrná odchylka pum ${Math.round(avg)} m od středu cíle.` : 'Žádné pumy nebyly shozeny.'; break; }
      default: ok = true; verdict = 'Výcvikový let ukončen.';
    }
    const fate = this.fate();
    if (fate.f !== 'OK' && fate.f !== 'WIA' && ok && spec.objective !== 'intercept' && spec.objective !== 'bomb') ok = false;
    this.result = {
      ok, verdict, fate, dmg, kills: pkills.map((k) => k.key), shared: claimKeys('shared'), probable: claimKeys('probable'), damaged: claimKeys('damaged'), groundDmg: s.groundDmg,
      lossesOwn: s.losses[pl.side], lossesEnemy: s.losses[enemy], lossesOwnBombers: s.lossesBomb[pl.side], lossesEnemyBombers: s.lossesBomb[enemy],
      raidLost, raidN, playerBombsW: s.playerBombsW, playerBombsHit: s.playerBombsHit, time: W.time, title: spec.title, side: pl.side, key: pl.key, objective: spec.objective,
      targetName: gt ? gt.def.name : '', day: spec.day, mode: spec.mode, names: forceNames(spec), landed: !!(this.playerOut && this.playerOut.how === 'landed'),
    };
    REC.stop(this.result);
    AUDIO.stopEngine();
    this.active = false;
    UI.debrief(this.result);
  },
};

/* ---------- Mission builders ---------- */
function raidOrigin(gt) { return { x: clamp(gt.x + 8000, -32000, 36000), z: 34000 }; }
function along(a, b, dist) { const d = Math.hypot(b.x - a.x, b.z - a.z) || 1; return { x: b.x - (b.x - a.x) / d * dist, z: b.z - (b.z - a.z) / d * dist }; }

// Generic raid mission. o: {day, target, playerSide, playerKey, playerRole('fighter'|'escort'|'bomber'|'dive'|'jabo'|'sweep'), bomber, nb, escort, ne, intercept, ni, alt, radar, time, clouds, wingmen}
function buildRaidMission(o) {
  const gt = targetById(o.target);
  const origin = raidOrigin(gt);
  const raidStartDist = o.playerSide === 'RAF' ? 21000 : Math.min(30000, Math.hypot(gt.x - origin.x, gt.z - origin.z) * 0.85);
  const rs = along(origin, gt, raidStartDist);
  const alt = o.alt;
  const groups = [];
  const bRole = o.bomber === 'ju87' ? 'dive' : (o.bomber === 'bf110' ? 'jabo' : 'bomber');
  const bAlt = bRole === 'jabo' ? Math.min(alt, 2600) : alt;
  const playerInBombers = o.playerSide === 'LW' && ['bomber', 'dive', 'jabo'].includes(o.playerRole);
  const nb = o.nb;
  if (playerInBombers) {
    groups.push({ side: 'LW', key: o.playerKey, n: 3, role: bRole, alt: bAlt, x: rs.x - 400, z: rs.z + 600, player: true, bombs: o.playerKey === 'bf110' ? [250, 250] : undefined });
    if (nb > 3) groups.push({ side: 'LW', key: o.bomber, n: nb - 3, role: bRole, alt: bAlt + 60, x: rs.x + 300, z: rs.z - 200, bombs: o.bomber === 'bf110' ? [250, 250] : undefined });
  } else {
    groups.push({ side: 'LW', key: o.bomber, n: nb, role: bRole, alt: bAlt, x: rs.x, z: rs.z, bombs: o.bomber === 'bf110' ? [250, 250] : undefined });
  }
  const ne = o.ne;
  if (ne > 0) {
    const ex = rs.x + 300, ez = rs.z + 700;
    if (o.playerSide === 'LW' && o.playerRole === 'escort') groups.push({ side: 'LW', key: o.playerKey, n: 4, role: 'escort', alt: bAlt + 700, x: ex, z: ez, player: true });
    groups.push({ side: 'LW', key: o.escort, n: Math.max(0, ne - (o.playerSide === 'LW' && o.playerRole === 'escort' ? 4 : 0)), role: 'escort', alt: bAlt + 600, x: ex + 500, z: ez + 300 });
  }
  // RAF interceptors
  const radar = o.radar === undefined ? 1 : o.radar;
  const pDist = o.playerSide === 'RAF' ? raidStartDist * lerp(0.3, 0.62, radar) : 0;
  const ip = along(origin, gt, Math.max(4000, pDist));
  const side = (s) => ({ x: ip.x + s * 2800, z: ip.z - 1500 });
  const iAlt = clamp(alt + lerp(-1800, 700, radar), 900, 7500);
  const hd = headingTo(ip.x, ip.z, rs.x, rs.z);
  if (o.playerSide === 'RAF') {
    const a = side(1);
    groups.push({ side: 'RAF', key: o.playerKey, n: 1 + (o.wingmen === undefined ? 2 : o.wingmen), role: 'fighter', alt: iAlt, x: a.x, z: a.z, heading: hd, player: true });
    const b = side(-1);
    if (o.ni > 0) groups.push({ side: 'RAF', key: o.intercept, n: o.ni, role: 'fighter', alt: iAlt - 300, x: b.x, z: b.z, heading: hd });
  } else {
    const n1 = Math.ceil(o.ni / 2), n2 = Math.floor(o.ni / 2);
    // RAF squadrons waiting near the coast and over the target
    const c1 = along(origin, gt, raidStartDist * 0.55), c2 = along(origin, gt, raidStartDist * 0.25);
    if (n1) groups.push({ side: 'RAF', key: o.intercept, n: n1, role: 'fighter', alt: clamp(alt - 400 + lerp(-1200, 600, radar), 900, 7000), x: c1.x - 3000, z: c1.z - 4000, heading: headingTo(c1.x, c1.z, rs.x, rs.z) });
    if (n2) groups.push({ side: 'RAF', key: o.intercept === 'spitfire' ? 'hurricane' : 'spitfire', n: n2, role: 'fighter', alt: clamp(alt + 300, 900, 7500), x: c2.x + 3000, z: c2.z - 5000, heading: headingTo(c2.x, c2.z, rs.x, rs.z) });
  }
  if (o.playerSide === 'LW' && o.playerRole === 'sweep') {
    groups.length = 0;
    groups.push({ side: 'LW', key: o.playerKey, n: 4, role: 'fighter', alt, x: rs.x, z: rs.z, player: true, heading: headingTo(rs.x, rs.z, gt.x, gt.z) });
    groups.push({ side: 'LW', key: o.playerKey, n: 4, role: 'fighter', alt: alt + 300, x: rs.x + 1500, z: rs.z + 800 });
    const c1 = along(origin, gt, raidStartDist * 0.5);
    groups.push({ side: 'RAF', key: o.intercept, n: Math.max(3, o.ni), role: 'fighter', alt: alt - 800, x: c1.x, z: c1.z - 2500, heading: headingTo(c1.x, c1.z, rs.x, rs.z) });
    groups.push({ side: 'RAF', key: o.intercept === 'spitfire' ? 'hurricane' : 'spitfire', n: 3, role: 'fighter', alt: alt - 1500, x: c1.x - 5000, z: c1.z - 6000, heading: 0 });
  }
  const objective = o.playerSide === 'RAF' ? 'intercept' : o.playerRole === 'escort' ? 'escort' : o.playerRole === 'sweep' ? 'sweep' : 'bomb';
  return { groups: groups.filter((g) => g.n > 0), target: o.target, objective };
}

function buildDuelMission(o) {
  const x = rand(-10000, 10000), z = -12000;
  const pSide = o.playerSide;
  const enemyKey = pSide === 'RAF' ? 'bf109' : pick(['spitfire', 'hurricane']);
  return {
    target: null, objective: 'free',
    groups: [
      { side: pSide, key: o.playerKey, n: o.n || 4, role: 'fighter', alt: o.alt, x: x, z: z + (pSide === 'RAF' ? -3500 : 3500), heading: pSide === 'RAF' ? Math.PI : 0, player: true },
      { side: pSide === 'RAF' ? 'LW' : 'RAF', key: o.enemyKey || enemyKey, n: o.ne || 4, role: 'fighter', alt: o.alt + rand(-300, 300), x: x + 800, z: z + (pSide === 'RAF' ? 3500 : -3500), heading: pSide === 'RAF' ? 0 : Math.PI, skill: o.skill },
    ],
  };
}

function quickMission(sc, side, key) {
  const t = rand() < 0.5 ? 'noon' : pick(['morning', 'evening']);
  let m;
  if (sc.mass) m = buildMassRaid({ id: sc.mass, side, key, role: side === 'LW' ? (isBomberKey(key) || (key === 'bf110' && sc.mass === 'aug15') ? 'bomber' : 'escort') : 'fighter', slot: 0, bigWing: sc.mass === 'sep15' && key === 'hurricane' });
  else if (sc.fighters) m = buildDuelMission({ playerSide: side, playerKey: key, alt: sc.alt });
  else {
    let role = 'fighter';
    if (side === 'LW') role = isBomberKey(key) ? (key === 'ju87' ? 'dive' : 'bomber') : key === 'bf110' && sc.jabo && sc.bomber === 'bf110' ? 'jabo' : 'escort';
    const bomber = side === 'LW' && ['bomber', 'dive', 'jabo'].includes(role) ? key : sc.bomber;
    m = buildRaidMission({ day: sc.day, target: sc.target, playerSide: side, playerKey: key, playerRole: role, bomber, nb: sc.nb, escort: sc.escort, ne: sc.ne, intercept: sc.intercept, ni: sc.ni, alt: sc.alt, radar: 0.7 });
  }
  return Object.assign(m, { mode: 'quick', title: sc.name, day: sc.day, time: m.time || t, clouds: pick(['clear', 'few', 'few', 'broken']), briefing: sc.text });
}

const TRAININGS = [
  { id: 'free', name: 'Volný let', text: 'Seznam se s ovládáním a letadlem. Žádný nepřítel, žádný spěch.' },
  { id: 'gunnery', name: 'Střelba na cíle', text: 'Čtyři neozbrojené cvičné stroje letí rovně. Nauč se předsazení a střílej z blízka.' },
  { id: 'dogfight', name: 'Souboj s instruktorem', text: 'Jeden protivník střední úrovně. Hlídej si ocas a energii.' },
  { id: 'bombing', name: 'Cvičné bombardování', text: 'Shoď pumy na cvičný cíl u Wissantu. Použij zaměřovač (V) nebo autopilota (A).' },

function trainingMission(id, side, key) {

        const bk = pick(ph.bombers.filter((b) => b !== 'ju87').concat(['do17']));
        const alt = rand(3800, 5400);
        const r = raid(gt, bk, nbBase, alt, route, late ? { at: at(gt, 0.6, route) } : {}); G.push(r);
        G.push(escortNear(r, 'bf109', neBase, 800));
        const home = { x: gt.x - 2000, z: gt.z - 3500 };
        const p0 = late ? home : at(gt, 0.35, route);
        G.push(me({ alt: late ? rand(900, 1600) : alt + rand(300, 900), x: p0.x, z: p0.z, heading: hdgTo(p0, r) }));
        if (!late) G.push(sq({ alt: alt - 500, x: p0.x - 4000, z: p0.z + 2000, heading: hdgTo(p0, r) }));
        start = late ? 'late' : '';
        title = late ? `Pozdní start: ${gt.name}` : `Nálet na ${tgtShort(gt)}`;
        brief = late ? `Radar selhal a pozorovatelé hlásili ${PLANES[bk].short} až nad pobřežím. Než jste nabrali výšku, jsou bombardéry skoro nad cílem ${gt.name}. Stoupejte pod nimi a útočte zespodu, dokud nezačnou shazovat.`
          : `Sektorové velitelství hlásí formaci ${nbBase + neBase}+ ${ROUTES[route].name}. ${PLANES[bk].short} v doprovodu Bf 109, výška asi ${Math.round(alt / 100) * 100} m. Pravděpodobný cíl: ${gt.name}. Máte výšku i čas, útočte na bombardéry zepředu.`;
      }
    }
    const pg = G.find((g) => g.player);
    const slotTxt = this.slotText(c, pg, Math.min(pg.n - 1, pg.playerSlot), leader);
    return { groups: G.filter((g) => g.n > 0), target, objective, typeTitle: title, brief: brief + ' ' + slotTxt, start, leaderName: leader };
  },
  /* ---------- Luftwaffe ---------- */
  makeLW(c, day, ph, s) {
    const role = CAREER.role(c), radar = clamp(s.radar / 100, 0.1, 1);
    const u = CAREER.unit(c), leader = this.leaderName(c);
    const big = day >= LAST_DAY ? 1.35 : 1, nb = Math.round(clamp(5 + s.lw / 100 * 7, 5, 13) * big), ni = Math.round(clamp(2 + s.raf / 100 * 7, 2, 9));
    let target = pick(ph.targets); if (day >= LAST_DAY) target = 'london';
    if (role === 'dive' && ['london', 'weybridge', 'biggin', 'kenley', 'hornchurch'].includes(target)) target = pick(['convoy', 'radar_dover', 'radar_rye', 'hawkinge', 'manston']);
    const gt = targetById(target);
    const route = target === 'london' && chance(0.35) ? 'thames' : gt.x < -15000 && chance(0.4) ? 'west' : pick(['calais', 'boulogne']);
    const R = ROUTES[route], v = R.via(gt);
    const G = [];
    const myBomb = ['bomber', 'dive', 'jabo'].includes(role);
    const bk = myBomb ? c.plane : pick(ph.bombers.filter((b) => b !== 'ju87' || day <= 39));
    const bRole = bk === 'ju87' ? 'dive' : bk === 'bf110' ? 'jabo' : 'bomber';
    const alt = bk === 'ju87' ? rand(3200, 4000) : bk === 'bf110' ? rand(2000, 2800) : rand(3800, 5400);
    const sweep = role === 'escort' && c.plane === 'bf109' && chance(0.3);
    const late = !chance(radar); // the RAF got the warning late: fewer fighters waiting, they come up from below
    const tp = this.trimPath(v, gt, 23000), st = tp.start, hd = headingTo(st.x, st.z, (tp.via[0] || gt).x, (tp.via[0] || gt).z);
    const pn = myBomb ? 3 : 4, slot = this.slot(c, pn);
    if (!sweep) {
      if (myBomb) {
        G.push({ side: 'LW', key: c.plane, n: 3, role: bRole, alt, x: st.x - 400, z: st.z + 600, heading: hd, via: tp.via, player: true, playerSlot: slot, bombs: c.plane === 'bf110' ? [250, 250] : undefined });
        if (nb > 3) G.push({ side: 'LW', key: bk, n: nb - 3, role: bRole, alt: alt + 60, x: st.x + 300, z: st.z - 200, heading: hd, via: tp.via, bombs: bk === 'bf110' ? [250, 250] : undefined });
      } else G.push({ side: 'LW', key: bk, n: nb, role: bRole, alt, x: st.x, z: st.z, heading: hd, via: tp.via, bombs: bk === 'bf110' ? [250, 250] : undefined });
      const close = role === 'escort' && chance(0.6);
      if (role === 'escort') G.push({ side: 'LW', key: c.plane, n: pn, role: 'escort', alt: alt + (close ? 300 : 1200), x: st.x + 300, z: st.z + 700, heading: hd, player: true, playerSlot: slot });
      G.push({ side: 'LW', key: c.plane === 'bf110' && role === 'escort' ? 'bf109' : 'bf109', n: Math.max(4, Math.round(nb * 0.6)), role: 'escort', alt: alt + 900, x: st.x + 800, z: st.z + 1000, heading: hd });
      G.closeEscort = close;
    } else {
      G.push({ side: 'LW', key: 'bf109', n: 4, role: 'fighter', alt: rand(6000, 7000), x: v[1].x, z: v[1].z + 4000, heading: headingTo(v[1].x, v[1].z, gt.x, gt.z), player: true, playerSlot: slot });
      G.push({ side: 'LW', key: 'bf109', n: 4, role: 'fighter', alt: 7200, x: v[1].x + 2000, z: v[1].z + 5000, heading: headingTo(v[1].x, v[1].z, gt.x, gt.z) });
    }
    // RAF reaction: early warning = squadrons waiting high on the route (Hurricanes head-on at the bombers, Spitfires above for the escort); late = few, climbing from below near the target
    const mid = { x: lerp(v[v.length - 1].x, gt.x, 0.4), z: lerp(v[v.length - 1].z, gt.z, 0.4) };
    if (!late) {
      G.push({ side: 'RAF', key: 'hurricane', n: Math.ceil(ni * 0.6), role: 'fighter', engageR: 22000, alt: alt + 200, x: mid.x + rand(-2000, 2000), z: mid.z - 6000, heading: headingTo(mid.x, mid.z - 6000, st.x, st.z) });
      G.push({ side: 'RAF', key: 'spitfire', n: Math.max(2, Math.floor(ni * 0.5)), role: 'fighter', engageR: 22000, alt: alt + 1500, x: mid.x + 3000, z: mid.z - 8000, heading: headingTo(mid.x, mid.z, st.x, st.z) });
    } else {
      G.push({ side: 'RAF', key: pick(['hurricane', 'spitfire']), n: Math.max(3, Math.ceil(ni * 0.5)), role: 'fighter', engageR: 12000, alt: Math.max(900, alt - 2200), x: gt.x + rand(-3000, 3000), z: gt.z - 5000, heading: headingTo(gt.x, gt.z - 5000, st.x, st.z) });
    }
    if (gt.type === 'docks' || ph.name === 'Blitz') G.push({ side: 'RAF', key: 'hurricane', n: 4, role: 'fighter', alt: alt - 600, x: gt.x - 4000, z: gt.z - 3000, heading: 0 });
    const pg = G.find((g) => g.player);
    const objective = sweep ? 'sweep' : role === 'escort' ? 'escort' : 'bomb';
    const title = sweep ? 'Freie Jagd nad Kentem' : role === 'escort' ? (G.closeEscort ? 'Těsný doprovod' : 'Volný doprovod') : role === 'dive' ? `Střemhlavý útok: ${gt.name}` : role === 'jabo' ? `Jabo: ${gt.name}` : `Nálet: ${gt.name}`;
    let brief;
    if (sweep) brief = 'Freie Jagd nad Kentem. Dva Schwärme Bf 109 vyletí bez bombardérů a vyprovokují Spitfiry a Hurricany k boji. Útočte ze slunce a z výšky a nenechte se vtáhnout do zatáček. Nad Anglií vydržíte jen pár minut.';
    else if (role === 'escort') brief = `${G.closeEscort ? 'Těsný doprovod: rozkaz zní držet se u bombardérů, i když vás to připraví o výšku a rychlost.' : 'Volný doprovod: letíte výš a napadáte stíhače dřív, než se dostanou k bombardérům.'} ${nb} ${PLANES[bk].short} letí ${R.name} na ${gt.name}.`;
    else brief = `Rozkaz: ${nb} letounů ${PLANES[bk].short} napadne ${gt.name}. Trasa ${R.name}, výška ${Math.round(alt / 100) * 100} m. ${role === 'dive' ? 'Nad cílem přejdeš do střemhlavého letu pod úhlem 70° a pumy uvolníš ve výšce kolem 800 m.' : 'Na cílovém úseku drž přímý kurz. Pumy shodíš zaměřovačem (V), nebo je nech na autopilotovi.'}`;
    brief += late ? ' Průzkum hlásí, že radarová síť je poškozená. Možná přiletíte dřív, než Angličané stihnou vzlétnout.' : ' Počítejte s tím, že Angličané o vás vědí. Nad pobřežím budou čekat.';
    brief += ' ' + this.slotText(c, pg, Math.min(pg.n - 1, pg.playerSlot), leader);
    return { groups: G.filter((g) => g.n > 0), target, objective, typeTitle: title, brief, start: late ? 'late' : '', leaderName: leader };
  },
  // start a raid `dist` metres before the target along its corridor (so nobody waits a quarter of an hour over the Channel)
  trimPath(v, gt, dist) {
    const pts = v.concat([{ x: gt.x, z: gt.z }]); let acc = 0;
    for (let i = pts.length - 1; i > 0; i--) {
      const a = pts[i - 1], b = pts[i], L = Math.hypot(b.x - a.x, b.z - a.z);
      if (acc + L >= dist) { const k = (dist - acc) / L; return { start: { x: b.x + (a.x - b.x) * k, z: b.z + (a.z - b.z) * k }, via: pts.slice(i, pts.length - 1) }; }
      acc += L;
    }
    return { start: pts[0], via: pts.slice(1, pts.length - 1) };
  },
  weighted(map) { const tot = Object.values(map).reduce((a, b) => a + b, 0); let r = Math.random() * tot; for (const [k, w] of Object.entries(map)) { r -= w; if (r <= 0 && w > 0) return k; } return Object.keys(map).find((k) => map[k] > 0); },
};

/* ===== Career events: postings, squadron rotation, leave, hospital, evasion, captivity and escape =====
   Every event is a document (who issued it, the original wording, why it happened) plus a choice.
   Resolved events are kept in c.service as the pilot's service record. */
function fmtAnyDay(d) { const t = dayDate(d); return `${t.getUTCDate()}. ${MONTHS[t.getUTCMonth()]} ${t.getUTCFullYear()}`; }
function monthYear(d) { const t = dayDate(d); const M = ['leden', 'únor', 'březen', 'duben', 'květen', 'červen', 'červenec', 'srpen', 'září', 'říjen', 'listopad', 'prosinec']; return `${M[t.getUTCMonth()]} ${t.getUTCFullYear()}`; }
function enAny(d) { const t = dayDate(d); return `${t.getUTCDate()} ${EN_MONTHS[t.getUTCMonth()]} ${t.getUTCFullYear()}`; }
function deAny(d) { const t = dayDate(d); return `${t.getUTCDate()}. ${DE_MONTHS[t.getUTCMonth()]} ${t.getUTCFullYear()}`; }

const EVENTS = {
  push(c, ev) { ev.day = ev.day !== undefined ? ev.day : c.day; (c.events || (c.events = [])).push(ev); },
  record(c, ev, outcome) {
    (c.service || (c.service = [])).push({ day: ev.day, title: ev.title, doc: { org: ev.org, head: ev.head, orig: ev.orig }, why: ev.why, text: ev.text, outcome: outcome || '', pic: ev.pic });
  },
  skipDays(c, n) { for (let i = 0; i < n; i++) { CAREER.simDay(c, c.day); c.day++; } },
  checkEnd(c) {
    if (c.status !== 'active') return;
    const s = c.strat;
    if (s.raf <= 18 || s.airfields <= 12) { c.status = 'end'; c.ended = c.day; c.result = 'LW'; }
    else if (c.day > LAST_DAY) { c.status = 'end'; c.ended = c.day; c.result = 'RAF'; }
  },
  finishCareer(c, status, epilogue) { c.status = status; c.ended = c.ended || c.day; c.epilogue = epilogue; },
  sameKindUnits(c) {
    const u = CAREER.unit(c);
    if (c.side === 'RAF') return UNITS.RAF.filter((x) => x.id !== u.id && x.group === 11 && !x.czech && x.id !== '303' && (x.startDay || 0) <= c.day);
    const fam = (p) => (p === 'bf109' ? 'jg' : p === 'bf110' ? 'zg' : 'kg');
    return UNITS.LW.filter((x) => x.id !== u.id && fam(x.plane) === fam(u.plane) && !x.endDay);
  },
  transfer(c, nu) { c.unit = nu.id; c.plane = nu.plane; c.jabo = !!nu.jabo; c.unitLoss = 0; c.pending = null; },

  /* ---- checks after an ordinary sortie (pilot back in service) ---- */
  afterSortie(c, r, out) {
    if (c.status !== 'active') return;
    const u = CAREER.unit(c), raf = c.side === 'RAF', ri = CAREER.rank(c);
    const inBob = !c.war || c.chapter === 'bob';
    // promotion to squadron command / Gruppenkommandeur may come with a posting
    if (inBob && out.promo && ri === 3 && !c.cmdOffered) {
      c.cmdOffered = true;
      const others = this.sameKindUnits(c);
      const nu = others.length ? pick(others) : null;
      if (raf) this.push(c, { kind: 'command', unitTo: nu && nu.id, title: 'Nabídka velení perutě', org: 'HQ No. 11 Group · Uxbridge', head: 'Posting notice',
        orig: nu ? `${RANKS.RAF[3]} ${c.name.toUpperCase()} is posted to command ${nu.name}, ${nu.base}, w.e.f. ${enAny(c.day)}. Signal follows.` : `${RANKS.RAF[3]} ${c.name.toUpperCase()} to assume command of ${u.name} w.e.f. ${enAny(c.day)}.`,
        why: `Peruť ${nu ? nu.name.replace('No. ', 'č. ') : ''} ztratila velitele. Skupina potřebuje na jeho místo zkušeného pilota a tvoje jméno padlo jako první.`,
        text: nu ? `Air Vice-Marshal Park ti nabízí velení ${nu.name} na letišti ${nu.base}. Můžeš ale požádat, abys zůstal u své perutě, kde teď uvolnil místo velitel stanice.` : `Přebíráš velení vlastní perutě.`,
        choices: nu ? [{ id: 'go', label: `Převzít ${nu.name.replace('Squadron', 'Sqn')}` }, { id: 'stay', label: 'Zůstat u své perutě' }] : [{ id: 'stay', label: 'Převzít velení' }], pic: 'transfer' });
      else this.push(c, { kind: 'command', unitTo: nu && nu.id, title: 'Jmenování Gruppenkommandeurem', org: `Luftflotte ${u.lf || 2} · Personalabteilung`, head: 'Versetzungsverfügung',
        orig: nu ? `Major ${c.name} wird mit Wirkung vom ${deAny(c.day)} zum ${nu.name} versetzt und mit der Führung einer Gruppe beauftragt.` : `Major ${c.name} wird mit der Führung einer Gruppe des ${u.name} beauftragt.`,
        why: `Ztráty mezi veliteli jsou vysoké a Göring po neúspěších v srpnu vyměňuje „staré“ velitele za mladé, úspěšné piloty.`,
        text: nu ? `Nabízejí ti Gruppe u ${nu.name} (${PLANES[nu.plane].short}, ${nu.base}). Můžeš zůstat u svého Geschwaderu a vést Gruppe tam.` : '',
        choices: nu ? [{ id: 'go', label: `Přejít k ${nu.id}` }, { id: 'stay', label: 'Zůstat u svého Geschwaderu' }] : [{ id: 'stay', label: 'Převzít Gruppe' }], pic: 'transfer' });
      return;
    }
    // Dowding rotated exhausted squadrons out of 11 Group
    if (inBob && raf && u.group === 11 && u.id !== '303' && !c.rotated && c.unitLoss >= 10 && c.day >= 28 && c.day <= LAST_DAY - 8 && chance(0.6)) {
      c.rotated = true;
      const rest = pick([['Catterick', 13], ['Drem', 13], ['Kirton-in-Lindsey', 12], ['Acklington', 13]]);
      const others = this.sameKindUnits(c), nu = others.length ? pick(others) : null;
      this.push(c, { kind: 'rotate', unitTo: nu && nu.id, restBase: rest[0], title: 'Peruť stažena k odpočinku', org: 'HQ Fighter Command · Bentley Priory', head: 'Movement order',
        orig: `${u.name} will move from ${u.base} to ${rest[0]} (No. ${rest[1]} Group) on ${enAny(c.day)}. Relieving squadron to arrive same day.`,
        why: `Peruť ztratila za poslední dny ${c.unitLoss >= 14 ? 'polovinu' : 'třetinu'} pilotů a strojů. Dowding unavené perutě střídá s odpočatými ze severu, než se úplně rozpadnou.`,
        text: `Peruť odlétá na ${rest[0]} doplnit stavy a zacvičit nováčky. Můžeš letět s ní, nebo požádat o převelení ${nu ? `k ${nu.name} (${PLANES[nu.plane].short}, ${nu.base})` : 'k jiné peruti'}, která v boji zůstává.`,
        choices: [{ id: 'rest', label: `S perutí na ${rest[0]}` }].concat(nu ? [{ id: 'go', label: `Převelet k ${nu.name.replace('Squadron', 'Sqn')}` }] : []), pic: 'transfer' });
      return;
    }
    // end of a tour: posted to an OTU as instructor
    if (inBob && raf && CAREER.tourH(c) >= 170 && !c.restOffered && chance(0.4)) {
      c.restOffered = true;
      this.push(c, { kind: 'rest', title: 'Přeložení k OTU', org: `RAF ${u.base} · Station Commander`, head: 'Posting notice',
        orig: `${CAREER.rankName(c)} ${c.name.toUpperCase()} is posted to No. 5 Operational Training Unit, Aston Down, for instructional duties, w.e.f. ${enAny(c.day + 2)}.`,
        why: `${Math.round(CAREER.opH(c) / 1.2)} operačních letů a ${Math.round(CAREER.tourH(c))} hodin za pár týdnů. Lékař perutě hlásí únavu a velitel nechce ztratit zkušeného pilota. Na OTU chybí instruktoři, kteří boj zažili.`,
        text: `Na OTU bys učil nováčky, kteří za tři týdny půjdou do boje. Válka pro tebe na čas skončí, bitvu budeš sledovat z cvičného letiště. Můžeš poprosit velitele, ať tě nechá u perutě.`,
        choices: [{ id: 'accept', label: 'Přijmout, jít učit' }, { id: 'refuse', label: 'Poprosit o setrvání' }], pic: 'otu' });
      return;
    }
    // leave
    if ((inBob || c.chapter === 'fr_phoney' || (c.war && LONG_CH.includes(c.chapter))) && c.missions >= 10 && (c.missions - (c.lastLeave || 0)) >= 10 && chance(0.3)) {
      c.lastLeave = c.missions;
      const n = raf ? 2 : randi(5, 7);
      if (c.chapter === 'fr_phoney') { this.push(c, this.leaveFrance(c)); return; }
      this.push(c, raf ? { kind: 'leave', n, title: '48 hodin volna', org: `${u.name} · Adjutant`, head: 'Leave pass',
        orig: `${CAREER.rankName(c)} ${c.name} granted 48 hours leave from 1800 hrs ${enAny(c.day)}.`,
        why: 'Velitel posílá piloty na volno po skupinách, jakmile má peruť dost strojů. Kdo nespí, začne dělat chyby.',
        text: u.czech ? 'Vlakem do Londýna. Čs. klub na Bayswater, pár piv, zprávy z domova, které nejsou dobré. Ráno spíš do deseti, poprvé za měsíc.' : 'Vlakem do Londýna. Divadlo, pár drinků v Shepherd\'s a jedna noc bez náletového poplachu. Skoro.',
        choices: [{ id: 'ok', label: 'Odjet na volno' }], pic: 'leave' }
        : { kind: 'leave', n, title: 'Fronturlaub', org: `${u.name} · Geschwaderadjutant`, head: 'Urlaubsschein',
        orig: `${CAREER.rankName(c)} ${c.name} erhält Fronturlaub vom ${deAny(c.day)} bis ${deAny(c.day + n)}.`,
        why: 'Po dlouhé sérii letů nad Anglii dostávají osádky několik dní dovolené. Mnozí si stěžují, že je to málo.',
        text: 'Vlakem přes Paříž domů. Doma se ptají, kdy padne Anglie. Neodpovídáš. Pak zpátky na letiště u Kanálu.',
        choices: [{ id: 'ok', label: 'Odjet na dovolenou' }], pic: 'leave' });
    }
  },

  // leave during the Phoney War: Paris, not London
  leaveFrance(c) {
    const u = CAREER.unit(c), ada = CAREER.svc(c) === 'AdA', cz = c.nation === 'CS' || u.czech, n = ada ? 4 : 3;
    return { kind: 'leave', n, title: ada ? 'Permission' : 'Leave in Paris', org: `${u.name} · ${ada ? 'Secrétariat' : 'Adjutant'}`, head: ada ? 'Titre de permission' : 'Leave pass',
      orig: ada ? `Le ${CAREER.rankName(c).toLowerCase()} ${c.name} est autorisé à se rendre à Paris du ${frDate(c.day)} au ${frDate(c.day + n)}.` : `${CAREER.rankName(c)} ${c.name} granted ${n} days leave in Paris from ${enAny(c.day)}.`,
      why: 'Na frontě se nebojuje a velitel posílá piloty na pár dní do Paříže. Podivná válka.',
      text: cz ? 'Vlakem do Paříže. Čs. vojenská správa na Rue Bonaparte, krajané v kavárnách, noviny z domova jsou čím dál horší. Večer Montmartre.' : ada ? 'Vlakem do Paříže. Kino, kavárna na bulváru, večer u rodiny. Jako by válka nebyla.' : 'Vlakem do Paříže. Folies Bergère, šampaňské za pár franků a Francouzky, které se smějí vaší francouzštině.',
      choices: [{ id: 'ok', label: 'Odjet do Paříže' }], pic: 'leave' };
  },
  /* ---- event outcomes ---- */
  resolve(c, ev, id) {
    if (ev.kind === 'story') { const r = STORY.resolve(c, ev, id); this.record(c, ev, r.outcome); return r; }
    const raf = c.side === 'RAF', u = CAREER.unit(c);
    const done = (outcome, next) => { this.record(c, ev, outcome); return { outcome, next }; };
    switch (ev.kind) {
      case 'command': {
        const nu = ev.unitTo && unitById(c.side, ev.unitTo);
        if (id === 'go' && nu) { this.transfer(c, nu); return done(raf ? `Přebral jsi velení ${nu.name} na letišti ${nu.base}. První večer v baru se tě piloti zkoumavě prohlížejí.` : `Přešel jsi k ${nu.name} na letiště ${nu.base}. Létáš na ${PLANES[nu.plane].short}.`); }
        return done(raf ? `Zůstáváš u ${u.name} a přebíráš její velení.` : `Zůstáváš u ${u.name} a vedeš Gruppe.`);
      }
      case 'rotate': {
        const nu = ev.unitTo && unitById(c.side, ev.unitTo);

    g.fillStyle = '#e4e6e4'; g.fillRect(0, hy, W, H - hy);

    SCENE.person(g, W * 0.38, H * 0.95, H * 0.38, { coat: '#2a2a28', hat: 'flat', legs: '#1a1a1a', walk: true });
    SCENE.person(g, W * 0.58, H * 0.97, H * 0.4, { coat: '#3a3a40', hat: 'none', legs: '#1a1a1a', walk: true, hands: 'carry', pack: '#4a4030' });
  } else if (kind === 'ship') { // a steamer at sea

/* ===== Ranks and decorations as they really came: promotions for time, merit, appointment or commission;
   decorations recommended after a particular action and gazetted days or weeks later ===== */
const RANKSYS = {
  ladder(c) { const S = SERVICES[CAREER.svc(c)] || SERVICES[c.side]; const r = CAREER.rk(c); return { S, list: S[r.t], abbr: S[r.t + 'A'], cz: S[r.t + 'Cz'], r }; },
  nameOf(svc, rk) { const S = SERVICES[svc]; const l = S[rk.t]; return l[Math.min(rk.i, l.length - 1)]; },
  czOf(svc, rk) { const S = SERVICES[svc]; const l = S[rk.t + 'Cz']; return l[Math.min(rk.i, l.length - 1)]; },
  set(c, rk, type) { const from = { ...CAREER.rk(c) }; const inDays = c.day - (c.rkDay !== undefined ? c.rkDay : c.day); c.rk = { t: rk.t, i: rk.i }; c.rkDay = c.day; c.rkPts = c.points; c.acting = type === 'acting'; return { type, from, to: { ...c.rk }, svc: CAREER.svc(c), inDays, missions: c.missions }; },

  // one promotion at most per sortie; returns the promo object or null
  checkPromo(c, r) {
    const rk = CAREER.rk(c), svc = CAREER.svc(c), S = SERVICES[svc];
    const inRank = c.day - (c.rkDay !== undefined ? c.rkDay : 0), since = c.points - (c.rkPts || 0), nk = CAREER.score(c);
    if (rk.t === 'nco') {
      // NCO pilots: a commission for distinguished service, or the next NCO grade with time
      if (inRank >= 12 && (nk >= 4 || c.missions >= 22 || (nk >= 2 && (c.medals || []).length)) && chance(0.55) && svc !== 'LW') return this.set(c, { t: 'off', i: 0 }, 'commission');
      if (svc === 'LW' && inRank >= 12 && (nk >= 6 || c.missions >= 25) && chance(0.4)) return this.set(c, { t: 'off', i: 0 }, 'commission');
      if (rk.i < S.nco.length - 1 && inRank >= 35 && c.missions >= 8 + rk.i * 8) return this.set(c, { t: 'nco', i: rk.i + 1 }, 'time');
      return null;
    }
    const top = S.off.length - 1;
    if (rk.i >= top) return null;
    // the last two steps (Wing Leader, station or Geschwader command) only in a war career, from 1942
    if (rk.i + 1 >= top - 1 && rk.i + 1 >= 4 && !(c.war && c.day >= 540) && svc !== 'CS') return null;
    // appointment: a flight or squadron commander was lost and someone has to lead (acting rank)
    if (rk.i >= 1 && rk.i <= 2 && (c.unitLoss || 0) >= 8 && c.missions >= 14 + rk.i * 6 && inRank >= 7 && chance(0.3)) return this.set(c, { t: 'off', i: rk.i + 1 }, 'acting');
    // merit: recommended by the commander after a run of success
    const need = [30, 60, 100, 150, 220, 300][rk.i], minDays = [14, 25, 40, 60, 90, 120][rk.i];
    if (since >= need && inRank >= minDays) return this.set(c, { t: 'off', i: rk.i + 1 }, 'merit');
    // time: war-substantive promotion after months in rank
    if (rk.i === 0 && inRank >= 45 && c.missions >= 8) return this.set(c, { t: 'off', i: 1 }, 'time');
    if (rk.i === 1 && inRank >= 120 && c.missions >= 25) return this.set(c, { t: 'off', i: 2 }, 'time');
    return null;
  },

  // decorations: recommendation now, gazette later (or an immediate award for an exceptional sortie)
  recommend(c, r, dayOfAction) {
    const svc = CAREER.svc(c), nk = CAREER.score(c), rk = CAREER.rk(c), q = c.medQ || (c.medQ = []);
    const has = (id) => (c.medals || []).includes(id) || q.some((x) => x.id === id);
    const killsNow = r.kills.length + (r.shared || []).length * 0.5;
    const act = { day: dayOfAction, title: r.title.split(' · ').pop(), kills: r.kills.slice(), shared: (r.shared || []).slice() };
    const add = (id, lag, why) => { if (!has(id)) q.push({ id, due: dayOfAction + lag, act, why }); };
    const bomb = svc === 'LW' && (isBomberKey(c.plane) || c.jabo);
    if (svc === 'RAF') {
      const off = rk.t === 'off';
      if (killsNow >= 3) add(off ? 'dfc' : 'dfm', 0, 'immediate');
      else if (nk >= 5) add(off ? 'dfc' : 'dfm', randi(6, 20), 'score');
      if (off && has('dfc') && nk >= 10) add('dfcbar', randi(8, 25), 'score');
      if (off && (nk >= 15 || (CAREER.rank(c) >= 3 && nk >= 8))) add('dso', randi(10, 30), 'lead');
      if (c.nation === 'CS' || CAREER.unit(c).czech) {
        if (nk >= 1 || c.missions >= 10) add('csvk', randi(10, 40), 'cs');
        if (nk >= 3) add('csza', randi(15, 45), 'cs');
        if (c.missions >= 30) add('cszas', randi(20, 50), 'cs');
      }
    } else if (svc === 'AdA') {
      // citations "à l'ordre" with the Croix de guerre came quickly and often
      if (killsNow >= 1) add('cdg', randi(3, 12), 'citation');
      if (rk.t === 'nco' && nk >= 4) add('mm', randi(8, 20), 'score');
      if (rk.t === 'off' && nk >= 5) add('lh', randi(10, 25), 'score');
      if (c.nation === 'CS' && (nk >= 1 || c.missions >= 10)) add('csvk', randi(20, 60), 'cs');
    } else if (svc === 'CS') { // the Czechoslovak regiment in the USSR
      if (nk >= 1 || c.missions >= 6) add('csvk', randi(10, 30), 'cs');
      if (nk >= 2) add('csza', randi(15, 35), 'cs');
      if (nk >= 4 || c.missions >= 15) add('rz', randi(20, 50), 'su');
    } else if (svc === 'PL') {
      if (killsNow >= 1 || c.missions >= 6) add('kw', randi(10, 30), 'score');
      if (nk >= 3) add('vm', randi(20, 50), 'score');
      if (c.nation === 'CS' && nk >= 1) add('csvk', randi(30, 90), 'cs');
    } else {
      if (nk >= 1 || c.missions >= 5) add('ek2', randi(2, 8), 'score');
      if (nk >= 5 || (bomb ? c.groundTargets >= 5 : c.missions >= 18)) add('ek1', randi(4, 14), 'score');
      if (c.missions >= 20) add('ffs', randi(1, 6), 'time');
      if (nk >= 20 || (bomb && c.groundTargets >= 18)) add('rk', randi(5, 15), 'score');
    }
  },
  // hand over everything that has come through
  deliver(c) {
    const q = c.medQ || [], due = q.filter((x) => x.due <= c.day), out = [];
    c.medQ = q.filter((x) => x.due > c.day);
    for (const x of due) { if (!c.medals.includes(x.id)) { c.medals.push(x.id); out.push(x); } }
    return out;
  },
};

const WARGEN = {

/* ===== One pilot through the war: the story between the flying chapters (1939–40; 1941–45 in 09j) =====
   Every node is a document with a decision. Dates follow the real escape routes and postings. */
const D = { mar15: -483, jun13: -393, jul15: -361, jul26: -350, jul31: -345, aug20: -325, aug30: -315, sep1: -313, sep3: -311, sep7: -307, sep17: -297, oct20: -264, dec1: -222, mar17: -115, apr15: -86, may1: -70, may10: -61, may23: -48, jun4: -36, jun16: -24, jun24: -16, jul7: -3, jul12: 2 };

const WAR = {
  // start a pilot at the beginning of the war
  create(name, nation, diff, track) {
    const c = CAREER.create(name, nation === 'DE' ? 'LW' : 'RAF', nation === 'DE' ? 'JG26' : '92', diff);
    Object.assign(c, { war: true, nation, chapter: 'story', unit: nation === 'DE' ? 'jg21' : nation === 'GB' ? 'sq1' : 'gc15', day: nation === 'CS' ? D.mar15 : nation === 'GB' ? D.sep3 : D.aug20, kills: [], log: [], events: [] });
    c.plane = CAREER.unit(c).plane;
    if (nation === 'CS') { c.csRk = track === 'nco' ? { t: 'nco', i: 1 } : { t: 'off', i: 1 }; c.svc = 'CS'; c.rk = { ...c.csRk }; }
    else { c.svc = nation === 'DE' ? 'LW' : 'RAF'; c.rk = { t: 'off', i: 0 }; }
    c.rkDay = c.day; c.rkPts = 0;
    c.strat = { raf: 75, lw: 100, radar: 100, airfields: 100, factories: 100, london: 100 };
    EVENTS.push(c, STORY.make(c, nation === 'CS' ? 'cs_start' : nation === 'GB' ? 'gb_start' : 'de_start'));
    store.save();
    return c;
  },
  // enter a flying chapter with a unit (a WUNITS id, or a UNITS id for the Battle of Britain)
  enter(c, chapter, unitId, o = {}) {
    const ch = CHAPTERS[chapter];
    c.chapter = chapter; c.unit = unitId; c.pending = null; c.unitLoss = 0;
    const u = CAREER.unit(c);
    c.plane = u.plane; c.side = u.side || (u.svc ? (u.svc === 'LW' ? 'LW' : 'RAF') : c.side); c.jabo = !!u.jabo;
    const day = Math.max(c.day, o.day !== undefined ? o.day : ch.from);
    if (chapter === 'bob') { for (let d = Math.max(0, c.stratDay || 0); d < day; d++) CAREER.simDay(c, d); c.stratDay = day; }
    c.day = day; c.chapTo = o.to !== undefined ? o.to : ch.to;
    const svc = u.svc || (c.side === 'LW' ? 'LW' : 'RAF');
    if (svc !== c.svc) this.convertRank(c, svc, o.keepNco);
  },
  // a new air force: the rank is set by that service's rules (Czech officers joined the Legion and the French as NCOs, the RAF as Pilot Officers)
  convertRank(c, svc, keepNco) {
    const cs = c.csRk;
    c.svc = svc;
    if (c.nation === 'CS' && cs) {
      if (svc === 'AdA') c.rk = c.officerRestored ? { t: 'off', i: Math.max(0, cs.i - 1) } : { t: 'nco', i: 0 };
      else if (svc === 'RAF') c.rk = cs.t === 'off' && !keepNco ? { t: 'off', i: 0 } : { t: 'nco', i: 0 };
      else if (svc === 'PL') c.rk = cs.t === 'off' ? { t: 'off', i: 0 } : { t: 'nco', i: 0 };
    }
    c.rkDay = c.day; c.rkPts = c.points;
  },
  // after every sortie in a war career: chapter over?
  afterApply(c, out) {
    if (!c.war || c.status !== 'active' || !CHAPTERS[c.chapter]) return;
    if (c.chapter === 'fr_phoney' && c.nation === 'CS' && !c.officerRestored && c.csRk && c.csRk.t === 'off' && c.day >= D.may1) {
      c.officerRestored = true; const from = { ...CAREER.rk(c) }; c.rk = { t: 'off', i: Math.max(0, c.csRk.i - 1) }; c.rkDay = c.day;
      EVENTS.push(c, STORY.make(c, 'cs_restore'));
    }
    if (c.chapter !== 'bob' && c.day > (c.chapTo !== undefined ? c.chapTo : CHAPTERS[c.chapter].to)) {
      const endNode = { pl_sept: c.side === 'LW' ? 'de_west' : 'cs_sept17', fr_phoney: 'fr_offensive', fr_may: c.side === 'LW' ? 'de_to_dunkirk' : c.nation === 'CS' ? 'cs_evac' : 'gb_aasf_end', dunkirk: c.side === 'LW' ? 'de_summer' : 'gb_dunkirk_end' }[c.chapter];
      c.chapter = 'story'; EVENTS.push(c, STORY.make(c, endNode));
    }
  },
  chapterTitle(c) { return c.chapter === 'story' ? 'Mezi kapitolami' : (CHAPTERS[c.chapter] || {}).title || ''; },
};

/* ---- story nodes ---- */
const STORY = {
  make(c, node, extra = {}) { const n = NODES[node]; const ev = n.make(c); return Object.assign({ kind: 'story', node, day: c.day }, ev, extra); },
  resolve(c, ev, id) {
    const n = NODES[ev.node]; const r = n.resolve(c, id) || {};
    if (r.day !== undefined) c.day = Math.max(c.day, r.day);
    if (r.enter) WAR.enter(c, r.enter[0], r.enter[1], r.enter[2] || {});
    if (r.end) EVENTS.finishCareer(c, r.end[0], r.end[1]);
    if (r.status) c.status = r.status;
    let next = r.next ? STORY.make(c, r.next) : null;
    if (!next && c.war && c.status === 'active' && CHAPTERS[c.chapter] && c.chapter !== 'bob') { // a chapter already over (a late arrival, a release from captivity)
      const before = (c.events || []).length; WAR.afterApply(c, {});
      if ((c.events || []).length > before) next = c.events.pop();
    }
    return { outcome: r.outcome || '', next };
  },
};

// careers saved by older versions: wherever they stopped (the battle over, a prison camp, the OTU, back over the Pyrenees),
// the story continues into 1941–45. Dead pilots and finished endings stay as they are.
const RESUMABLE = ['end', 'paused', 'POW', 'EVADE', 'instructor', 'evaded', 'escaped', 'resistance'];
WAR.migrate = function (c) {
  if (!c || c.mig11 || !RESUMABLE.includes(c.status)) return false;
  if (c.war && c.status === 'POW' && c.epilogue && !(c.events || []).length && c.migPow) return false;
  c.mig11 = true;
  // a Battle-of-Britain-only career becomes a war career from here on
  if (!c.war) {
    const u = CAREER.unit(c);
    Object.assign(c, { war: true, nation: c.side === 'LW' ? 'DE' : u.czech ? 'CS' : 'GB', svc: c.svc || c.side, chapter: c.chapter || 'bob' });
    CAREER.rk(c);
    if (c.nation === 'CS' && !c.csRk) c.csRk = { t: c.rk.t, i: Math.min(2, (c.rk.i || 0) + 1) };
  }
  const pending = (c.events || []).length > 0;
  if (pending) { store.save(); return true; } // the story is still running (a camp, an evasion): it now leads on into 1941
  const epi = c.epilogue;
  if (c.status === 'end' || (c.status === 'paused' && c.chapter === 'bob')) { c.result = c.result || 'RAF'; WAR.bobOver(c); }
  else if (c.status === 'paused' && (epi || '').includes('Zůstal v SSSR')) { c.status = 'active'; c.ended = null; c.epilogue = null; c.chapter = 'story'; c.day = Math.max(c.day, 580); EVENTS.push(c, STORY.make(c, 'cs_buzuluk')); }
  else if (c.status === 'POW') { // still behind the wire: another chance to escape
    c.migPow = true; c.epilogue = null; c.chapter = 'story';
    EVENTS.push(c, Object.assign(EVENTS.powEvent(c, `${epi ? epi.split('. ')[0] + '. ' : ''}Únikový výbor chystá další plán a hledá lidi, kteří se nebojí.`), { day: Math.max(c.day, (c.ended || c.day) + 30) }));
  } else if (['instructor', 'evaded', 'escaped', 'resistance'].includes(c.status)) {
    const st = c.status; c.status = 'active'; c.ended = c.ended || c.day; EVENTS.finishCareer(c, st, epi);
  }
  store.save();
  return true;
};
WAR.migrateAll = function () { for (const c of store.data.careers || []) { try { WAR.migrate(c); } catch (e) { console.warn('migrace kariéry', e); } } };

// how fast a war chapter moves between sorties (Settings → Tempo války)
WAR.paceMult = function (ch) {
  const p = (store.data.settings || {}).warPace || 2, long = ch.step && ch.step[0] >= 7;
  return (long ? [1, 1.8, 2.8] : [1, 1.4, 2])[p - 1] || 1;
};

function lifePool(c, day) {
  const svc = CAREER.svc(c), ch = c.chapter, cz = c.nation === 'CS' || CAREER.unit(c).czech;
  if (c.unit === 'csiap1') return LIFE.EAST;
  if (c.side === 'LW') return ch === 'pl_sept' ? LIFE.LW39 : day < 0 ? LIFE.LW40 : LIFE.LW.filter((x, i) => !(i === 6 && day < 185) && !(i === 8 && day < 500)); // RAF raids on the airfields and Galland as General der Jagdflieger came later
  if (svc === 'PL' || ch === 'pl_sept') return LIFE.PL39;
  if (svc === 'AdA') return LIFE.FR_AdA.concat(cz ? LIFE.CZ_FR : []);
  if (ch === 'fr_phoney' || ch === 'fr_may') return LIFE.FR_RAF;
  if (day < 185) return LIFE.RAF40.concat(cz ? LIFE.CZ.slice(0, 2) : []);

}
WAR.between = function (c, from, to) {
  const out = [], nat = c.nation || (c.side === 'LW' ? 'DE' : 'GB');
  for (const [d, who, t] of NEWS) if (d > from && d <= to && (who === '*' || who === nat)) out.push(`${fmtAnyDay(d)}: ${t}`);
  if (to - from >= 4) {
    const pool = lifePool(c, from).slice();
    const n = to - from >= 14 ? 2 : 1;
    // do not repeat a line until the whole pool has been used
    const key = (x) => (typeof x === 'function' ? x.toString() : x).slice(0, 48), seen = c.lifeSeen || (c.lifeSeen = []);
    let fresh = pool.filter((x) => !seen.includes(key(x)));
    if (fresh.length < n) { c.lifeSeen = seen.filter((k) => !pool.some((x) => key(x) === k)); fresh = pool.slice(); }
    for (let i = 0; i < n && fresh.length; i++) { const x = fresh.splice(randi(0, fresh.length - 1), 1)[0]; c.lifeSeen.push(key(x)); out.push(typeof x === 'function' ? x(CAREER_GEN.leaderName(c)) : x); }
    if (c.lifeSeen.length > 80) c.lifeSeen = c.lifeSeen.slice(-80);
  }
  return out;
};

  ctx: null, master: null, out: null, noise: null, eng: null, ext: [], wind: null, guns: {}, muted: false, lastPop: 0, camPrev: null, camVel: null, fireT: { mg: -9, cannon: -9 },

  resume() { if (this.ctx && this.ctx.state !== 'running') { try { const r = this.ctx.resume(); if (r && r.catch) r.catch(() => {}); } catch (e) { /* ignore */ } } },
  statusText() {
    if (!this.ctx) return 'zapne se po prvním kliknutí';
    if (this.muted) return 'ztlumený (klávesa U)';
    if (this.ctx.state === 'running') return store.data.settings.sound > 0 ? 'běží' : 'hlasitost je na nule';

  test() {

  tick() {

  },
  setVol(v) { if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : v, this.ctx.currentTime, 0.05); },
  toggleMute() { this.muted = !this.muted; this.setVol(store.data.settings.sound); return this.muted; },
  noiseSrc(loop) { const s = this.ctx.createBufferSource(); s.buffer = this.noise; s.loop = !!loop; return s; },
  makeGunBuffer(rate, heavy) {

  // one engine cycle repeated with small irregularities: every cylinder's exhaust pulse is a decaying resonance plus a burst of noise.

  },
  makeVerb() { // short metallic room for the cockpit / airframe resonance

  },
  engineKind(key) {

    if (['spitfire', 'hurricane', 'spit5', 'spit9', 'hurri2', 'battle', 'defiant', 'ms406', 'd520'].includes(key)) return 'merlin';
    if (['bf109', 'bf110', 'bf109g', 'bf109f'].includes(key)) return 'db601';
    if (['h75', 'mb152', 'fw190', 'la5', 'b17', 'boston', 'potez63'].includes(key)) return 'radial14';

  // the V-1's pulse-jet: a hard, rattling buzz about fifty times a second
  makePulseBuffer() {

  },
  /* ---------- player engine ---------- */
  startEngine() {
    if (!this.ctx) return; this.stopEngine();

  updateEngine() { /* kept for compatibility; see update() */ },
  /* ---------- other aircraft ---------- */

  },
  /* ---------- guns ---------- */
  gun(cal) { this.fireT[cal === 'cannon' ? 'cannon' : 'mg'] = performance.now(); },
  startGun(k) {

  stopGun(k) { const gs = this.guns[k]; if (!gs) return; const t = this.ctx.currentTime; gs.g.gain.setTargetAtTime(0, t, 0.02); gs.s.stop(t + 0.15); delete this.guns[k]; },

  /* ---------- one-shots ---------- */

  flak(pos) {

  hit() {

  /* ---------- per-frame mix ---------- */

    g.fillStyle = '#0a0a0a'; g.beginPath(); g.arc(Math.cos(ba) * r * 0.72, -r * 0.2 + Math.sin(ba) * r * 0.72, r * 0.065, 0, 7); g.fill();
    g.fillStyle = '#2b2a26'; g.beginPath(); g.arc(0, 0, r * 0.07, 0, 7); g.fill();
    g.restore();

};

  if (r && r.day !== undefined && r.day < -36) { // older records without names: tell by date and aircraft
    if (r.day <= -290 || ['p11c', 'rwd8'].includes(r.key)) return 'polské letectvo';
    if (['h75', 'ms406', 'mb152', 'd520', 'potez63'].includes(r.key)) return 'francouzské letectvo';
    return r.side === 'LW' && r.day > -283 && r.day < -48 ? 'Spojenci' : 'RAF';
  }
  return 'RAF';
};
// one line of claims for the log: "Bf 109, ½ Do 17 · 1 pravd. · 2 pošk."
function claimStr(l, names) {
  const sh = (k) => (PLANES[k] ? PLANES[k].short : k);
  const parts = [];
  const d = l.killKeys || [], s2 = l.sharedKeys || [];
  if (names) { const n = d.map(sh).concat(s2.map((k) => '½ ' + sh(k))); if (n.length) parts.push(n.join(', ')); }
  else { const v = d.length + s2.length * 0.5 || (l.kills || 0); if (v) parts.push(`${CAREER.fmtScore(v)} sestřel${v > 1 ? 'y' : ''}`); }

  if ((l.dmgKeys || []).length) parts.push(`${l.dmgKeys.length} pošk.`);

}

  },
  logbook(c) {
    const L = c.log, tot = L.reduce((a, l) => a + (l.time || 0), 0) + L.length * 1500; // plus taxi, climb and transit for each sortie
    const hh = Math.floor(tot / 3600), mm = Math.round((tot % 3600) / 60);
    const fighters = c.kills.filter((k) => !isBomberKey(k)).length;
    const raf = c.side === 'RAF';
    // promotions, decorations, postings and the rest of the service record, newest first
    const recs = (c.awards || []).map((a, i) => ({ day: a.day, title: a.title, org: a.doc.org, a: i })).concat((c.service || []).map((v, i) => ({ day: v.day, title: v.title, org: v.doc.org, v: i }))).sort((p, q) => q.day - p.day);
    const s = this.set(`<div class="panel-wrap" style="max-width:980px"><div class="topbar"><h2>${raf ? "Pilot's Flying Log Book" : 'Flugbuch'}</h2><button class="btn" data-back>Zpět</button></div>
      <div class="dossier"><div class="doc-head"><span>${esc(CAREER.rankName(c))} ${esc(c.name)} · ${esc(CAREER.unit(c).name)}</span><span>${raf ? 'Form 414' : 'Luftwaffe'}</span></div>
      <div class="logtot"><span>Operačních letů <b>${L.length}</b></span><span>Nalétáno <b>${hh} h ${String(mm).padStart(2, '0')} min</b></span><span>Sestřely <b>${CAREER.fmtScore(CAREER.score(c))}</b> (stíhačky ${fighters}, bombardéry ${c.kills.length - fighters}${(c.shared || []).length ? `, sdílené ${c.shared.length}×½` : ''})</span><span>Pravděpodobně <b>${(c.probables || []).length}</b></span><span>Poškozeno <b>${(c.damaged || []).length}</b></span><span>Úspěšnost <b>${L.length ? Math.round(100 * L.filter((l) => l.ok).length / L.length) : 0} %</b></span>${c.groundTargets ? `<span>Zásahy cílů <b>${c.groundTargets}</b></span>` : ''}</div>
      <div class="tablebox"><table class="logbook"><thead><tr><th>Datum</th><th>Letoun</th><th class="hide-s">Úkol</th><th>Doba</th><th>Sestřely</th><th>Výsledek</th><th class="hide-s">Body</th></tr></thead><tbody>
      ${L.map((l, i) => `<tr data-entry="${i}"><td>${fmtDayShort(l.day)}</td><td>${esc(l.key && PLANES[l.key] ? PLANES[l.key].short : PLANES[c.plane].short)}</td><td class="hide-s">${esc(l.title.split(' · ').pop())}</td><td class="n">${l.time ? Math.round(l.time / 60 + 25) + ' min' : '–'}</td><td>${claimStr(l, true) || '–'}</td><td>${esc(l.text)}</td><td class="n hide-s">${l.points !== undefined ? '+' + l.points : ''}</td></tr>`).join('')}
      </tbody></table>
      ${recs.length ? `<table class="logbook" style="margin-top:14px"><thead><tr><th>Datum</th><th>Služební záznam</th><th class="hide-s">Vydal</th></tr></thead><tbody>${recs.map((x) => `<tr ${x.a !== undefined ? `data-aw="${x.a}"` : `data-svc="${x.v}"`}><td>${fmtDayShort(x.day)}</td><td>${esc(x.title)}</td><td class="hide-s">${esc(x.org)}</td></tr>`).join('')}</tbody></table>` : ''}
      </div></div></div>`);
    this.bind(s, { '[data-back]': () => this.careerHome(c), '[data-entry]': (e, el) => this.logEntry(c, +el.dataset.entry, () => this.logbook(c)),
      '[data-aw]': (e, el) => this.ceremony(c, [c.awards[+el.dataset.aw]], 0, () => this.logbook(c)),
      '[data-svc]': (e, el) => EVENTS.view(c, +el.dataset.svc, () => this.logbook(c)) });
  },
  logEntry(c, i, back) {
    const l = c.log[i]; if (!l) { back(); return; }
    const r = { side: l.side || c.side, key: l.key || c.plane, title: l.title, time: l.time || 0, fate: { sc: l.sc || 'return', sea: !!l.sea, f: l.fate, text: l.text }, lossesOwn: l.lossesOwn || 0 };
    const rows = [];
    rows.push(['Letoun', PLANES[r.key] ? PLANES[r.key].name : r.key]);
    rows.push(['Zničeno', (l.killKeys || []).length ? l.killKeys.map((k) => PLANES[k].short).join(', ') : String(l.kills || 0)]);
    if ((l.sharedKeys || []).length) rows.push(['Sdílené (½)', l.sharedKeys.map((k) => PLANES[k].short).join(', ')]);
    if ((l.probKeys || []).length) rows.push(['Pravděpodobně zničené', l.probKeys.map((k) => PLANES[k].short).join(', ')]);
    if ((l.dmgKeys || []).length) rows.push(['Poškozené', l.dmgKeys.map((k) => PLANES[k].short).join(', ')]);
    if (l.lossesOwn !== undefined) rows.push([`Ztráty: ${sideName(r.side, l)}`, l.lossesOwn], [`Ztráty: ${sideName(r.side === 'RAF' ? 'LW' : 'RAF', l)}`, l.lossesEnemy]);
    if (l.raidN && l.objective !== 'free' && l.objective !== 'sweep') rows.push(['Sestřelené bombardéry', `${l.raidLost} z ${l.raidN}`]);
    if (l.target) rows.push([`Cíl · ${l.target}`, `${Math.round((l.dmg || 0) * 100)} % poškození`]);
    if (l.time) rows.push(['Doba v akci', `${Math.floor(l.time / 60)} min`]);
    if (l.points !== undefined) rows.push(['Body', '+' + l.points]);
    const aw = (c.awards || []).filter((a) => a.action === l.day);
    const s = this.set(`<div class="panel-wrap" style="max-width:940px"><div class="topbar"><h2>Záznam z ${fmtDay(l.day)}</h2><button class="btn" data-back>Zpět</button></div>
      <div class="dossier"><div class="doc-head"><span>${r.side === 'RAF' ? 'Combat report' : 'Gefechtsbericht'}</span><span>${fmtDay(l.day)}</span></div>
      <h2>${esc(l.title.split(' · ').pop())}</h2>
      <div class="deb-row"><figure class="photo fate-photo"><canvas id="fatepic" width="560" height="360"></canvas><figcaption>${esc(fateSceneInfo(r).caption)}</figcaption></figure>
      <div class="deb-main"><p><b>${esc(l.verdict || '')}</b> ${esc(l.text)}</p>
      <table class="res-table">${rows.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('')}</table>
      ${aw.length ? `<p style="margin-top:10px"><b>Následovalo:</b> ${aw.map((a, k) => `<button class="btn ghost" data-aw="${k}" style="padding:2px 10px">${esc(a.title)}</button>`).join(' ')}</p>` : ''}</div></div>
      </div></div>`);
    try { drawFateScene($('#fatepic'), r); } catch (e) { console.warn(e); }
    this.bind(s, { '[data-back]': back, '[data-aw]': (e, el) => this.ceremony(c, [aw[+el.dataset.aw]], 0, () => this.logEntry(c, i, back)) });
  },

    UNITS_SVC = spec.svc || null; const u = unitsFor(side);

    const cloudTxt = { clear: 'jasno', few: 'skoro jasno', broken: 'polojasno', overcast: 'zataženo' }[spec.clouds] || '';

    const s = this.set(`<div class="panel-wrap">
      <div class="dossier">
        <div class="stamp">${stamp}</div>

        <div class="doc-cols">

              ${gt ? `<dt>Cíl</dt><dd>${esc(gt.name)}</dd>` : ''}

              <dt>Nepřítel</dt><dd>${esc(sum(enemyG))}</dd>

        </div>

    withTheatre(spec.theatre, spec.day, () => {
    const gt = spec.target ? targetById(spec.target) : null;
    const routes = [];

    if (gt && lwB) { const tot = spec.groups.filter((g) => g.side === 'LW').reduce((a, g) => a + g.n, 0); routes.push({ from: [lwB.x, lwB.z], to: [gt.x, gt.z], color: '#a3282c', label: `${tot}+ · ${Math.round(u.alt(lwB.alt) / 1000)}${u.imp ? 'k ft' : ' km'}` }); }
    const planes = spec.groups.map((g) => ({ x: g.x, z: g.z, heading: g.heading !== undefined ? g.heading : (gt ? headingTo(g.x, g.z, gt.x, gt.z) : 0), color: g.player ? '#d9a521' : g.side === 'RAF' ? '#2c4f86' : '#3c3f42', player: g.player }));
    const cv = $('#bmap'); const H = Math.round(720 * WORLD.h / WORLD.w); cv.height = H;
    drawMap(cv, { highlight: gt ? gt.id : null, routes, planes });
    });
    this.bind(s, { '[data-back]': back, '[data-go]': () => fly(spec) });

  /* ---------- quick missions ---------- */
  quick(selId) {
    const pickSide = {};
    const ALL = SCENARIOS.concat(WAR_SCENARIOS);
    let cur = selId && ALL.find((x) => x.id === selId) ? selId : SCENARIOS[0].id;
    const list = ALL.sort((a, b) => a.day - b.day).map((sc) => `<button class="qitem" data-pick="${sc.id}" aria-pressed="${sc.id === cur}"><span>${sc.day !== undefined ? fmtDay(sc.day) : ''}</span><b>${esc(sc.name)}</b></button>`).join('');
    const s = this.set(`<div class="panel-wrap"><div class="topbar"><h2>Rychlá mise</h2><button class="btn" data-back>Zpět</button></div><div class="qwrap"><nav class="qlist" aria-label="Střetnutí">${list}</nav><div id="qdet"></div></div></div>`);
    const fill = (card) => {
      const sc = ALL.find((x) => x.id === card.dataset.sc), side = pickSide[sc.id] || 'RAF';
      let opts;
      if (sc.war) { const sel = $('[data-plane]', card); sel.innerHTML = (sc.war[side] || []).map((id) => `<option value="${id}">${esc(WUNITS[id].name)} · ${esc(PLANES[unitPlane(WUNITS[id], sc.day)].name)}</option>`).join(''); return; }
      if (side === 'RAF') opts = RAF_PLANES;
      else if (sc.fighters) opts = ['bf109', 'bf110'];
      else if (sc.lwKeys) opts = sc.lwKeys;
      else opts = [sc.bomber === 'bf110' ? 'bf110' : sc.bomber, sc.escort].filter((v, i, a) => a.indexOf(v) === i);
      const sel = $('[data-plane]', card);
      sel.innerHTML = opts.map((k) => `<option value="${k}">${esc(PLANES[k].name)}${side === 'LW' && !sc.fighters ? (k === sc.bomber || (sc.lwKeys && (isBomberKey(k) || (k === 'bf110' && sc.mass === 'aug15'))) ? ' · v útočném svazu' : ' · doprovod') : ''}</option>`).join('');
      if (side === 'RAF') sel.value = sc.intercept || 'spitfire';
    };
    const show = () => {
      const sc = ALL.find((x) => x.id === cur), side = pickSide[sc.id] || 'RAF';
      const det = $('#qdet', s);
      det.innerHTML = `<div class="card qcard" data-sc="${sc.id}">
        <div class="meta">${sc.day !== undefined ? fmtDay(sc.day) : ''}</div>
        <h3>${esc(sc.name)}</h3><p>${esc(sc.text)}</p>
        <div class="field">Strana<div class="chips"><button class="chip" data-side="RAF" aria-pressed="${side === 'RAF'}">${sc.war ? 'Spojenci' : 'RAF'}</button>${sc.war && !sc.war.LW ? '' : `<button class="chip" data-side="LW" aria-pressed="${side === 'LW'}">Luftwaffe</button>`}</div></div>
        <label class="field">${sc.war ? 'Jednotka' : 'Letoun'}<select data-plane></select></label>
        <div class="actions"><button class="btn primary" data-brief>Rozkaz k akci</button></div></div>`;
      fill($('[data-sc]', det));
      this.bind(det, {
        '[data-side]': (e, el) => { pickSide[cur] = el.dataset.side; show(); },
        '[data-brief]': () => { const sd = pickSide[sc.id] || 'RAF', v = $('[data-plane]', det).value; const spec = sc.war ? warQuickMission(sc, sd, v) : quickMission(sc, sd, v); this.briefing(spec, () => this.quick(sc.id)); },
      });
    };
    show();
    this.bind(s, {
      '[data-back]': () => this.menu(),
      '[data-pick]': (e, el) => { cur = el.dataset.pick; $$('[data-pick]', s).forEach((b) => b.setAttribute('aria-pressed', b === el)); show(); },
    });

        '[data-save]': () => { read(); if (idx === null) ms.unshift(m); else ms[idx] = m; store.save(); toast('Mise uložena.'); this.editor(); },

  resume() { this.hide(); CTRL.paused = false; AUDIO.resume(); },
  debrief(r) {
    GAME.state = 'debrief'; HUD.clear(); $('#touch').hidden = true; $('#mapov').hidden = true; HUD.mapOn = false;
    let cr = null, c = null;
    if (r.mode === 'career') { c = store.data.careers.find((x) => x.id === GAME.careerId); if (c) cr = CAREER.apply(c, r); }
    const enemy = sideName(r.side === 'RAF' ? 'LW' : 'RAF', r);
    const fmtT = (t) => `${Math.floor(t / 60)} min ${String(Math.floor(t % 60)).padStart(2, '0')} s`;
    const killNames = r.kills.map((k) => PLANES[k].short);
    const stamp = r.ok ? (r.side === 'RAF' ? 'ÚSPĚCH' : 'ÚSPĚCH') : 'NEÚSPĚCH';
    const rows = [
      ['Zničeno', killNames.length ? `${killNames.length} · ${killNames.join(', ')}` : '0'],
    ];
    const nm = (a) => (a || []).map((k) => PLANES[k].short).join(', ');
    if ((r.shared || []).length) rows.push(['Sdílené sestřely (½)', `${r.shared.length} · ${nm(r.shared)}`]);
    if ((r.probable || []).length) rows.push(['Pravděpodobně zničené', `${r.probable.length} · ${nm(r.probable)}`]);
    if ((r.damaged || []).length) rows.push(['Poškozené', `${r.damaged.length} · ${nm(r.damaged)}`]);
    rows.push([`Ztráty: ${sideName(r.side, r)}`, r.lossesOwn], [`Ztráty: ${enemy}`, r.lossesEnemy]);
    if (r.raidN && r.objective !== 'free' && r.objective !== 'sweep') rows.push(['Sestřelené bombardéry', `${r.raidLost} z ${r.raidN}`]);
    if (r.targetName) rows.push([`Poškození cíle · ${r.targetName}`, `${Math.round(r.dmg * 100)} %`]);
    if (r.playerBombsW) rows.push(['Tvoje pumy na cíli', `${r.playerBombsHit} z ${r.playerBombsW} kg`]);
    rows.push(['Doba letu', fmtT(r.time)]);
    let career = '';
    if (cr) {
      const bits = [`Získané body: ${cr.points}.`];
      if (cr.promo) bits.push(`${cr.promo.type === 'acting' ? 'Jmenován s dočasnou hodností' : cr.promo.type === 'commission' ? 'Povýšen na důstojníka' : 'Povýšen na hodnost'} ${RANKSYS.nameOf(cr.promo.svc, cr.promo.to)}.`);
      for (const m of cr.medals) bits.push(`Vyznamenání: ${MEDALS[m].name}.`);
      if ((c && c.medQ || []).length) bits.push('Návrh na vyznamenání je na cestě.');
      if (cr.wounded) bits.push(`Zranění: ${cr.wounded} dní v nemocnici.`);
      if (cr.opHours && c) bits.push(`Do zápisníku letů přibylo ${cr.opHours} operačních hodin, celkem ${Math.round(CAREER.opH(c))}${c.side === 'RAF' && c.war ? ` (túra ${Math.round(CAREER.tourH(c))}/200)` : ''}.`);
      if ((cr.news || []).length) bits.push(`Mezitím, do ${fmtDay(c.day)}: ${cr.news.join(' ')}`);
      if (cr.transfer) bits.push(cr.transfer);
      if (cr.end) bits.push(cr.end === 'RAF' ? 'Bitva skončila. RAF ubránilo Británii, invaze se odkládá.' : 'Bitva skončila. RAF se zhroutilo, Luftwaffe ovládla nebe.');
      if (c && (c.events || []).length && c.status !== 'active') bits.push('Příběh ještě nekončí. Rozhodni, co dál.');
      else if (c && (c.events || []).length) bits.push('Čekají tě rozkazy od velitelství.');
      else if (c && c.status !== 'active' && c.status !== 'end') bits.push(`Kariéra končí: ${CAREER.statusText(c).toLowerCase()}.`);
      career = `<div class="doc-head" style="margin:6px 0 0"><span>Personální oddělení</span><span>${c ? esc(CAREER.rankName(c) + ' ' + c.name) : ''}</span></div><p>${bits.map(esc).join(' ')}</p>`;
    }
    const s = this.set(`<div class="panel-wrap" style="max-width:940px"><div class="dossier has-stamp-top">
      <div class="stamp">${stamp}</div>
      <div class="doc-head"><span>${r.side === 'RAF' ? 'Combat report · hlášení po akci' : 'Gefechtsbericht · hlášení po akci'}</span><span>${r.day !== undefined ? fmtDay(r.day) : ''}</span></div>
      <h2>${esc(r.title.split(' · ').pop())}</h2>
      <div class="deb-row"><figure class="photo fate-photo"><canvas id="fatepic" width="560" height="360"></canvas><figcaption>${esc(fateSceneInfo(r).caption)}</figcaption></figure>
      <div class="deb-main"><p><b>${esc(r.verdict)}</b> ${esc(r.fate.text)}</p>
      <table class="res-table">${rows.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('')}</table></div></div>
      ${career}
      <div class="btnrow" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
        <button class="btn primary" data-cont>${r.mode === 'career' ? (cr && cr.awards && cr.awards.length ? (cr.promo ? 'Převzít povýšení' : 'Převzít vyznamenání') : c && (c.events || []).length ? 'Pokračovat' : 'Zpět k jednotce') : 'Pokračovat'}</button>
        <button class="btn" data-film>Přehrát záznam</button><button class="btn ghost" data-save>Uložit záznam</button>
        ${r.mode !== 'career' ? '<button class="btn ghost" data-again>Letět znovu</button>' : ''}
        ${r.mode === 'career' && c && CAREER.canRetry(c) ? '<button class="btn ghost" data-retry>Letět misi znovu</button>' : ''}
      </div></div></div>`);
    this.bind(s, {
      '[data-cont]': () => { if (r.mode === 'career' && c) { GAME.state = 'menu'; DEMO.start(); const aw = (cr && cr.awards) || []; const evs = () => EVENTS.screen(c, () => this.careerHome(c)); if (aw.length) this.ceremony(c, aw, 0, evs); else evs(); } else this.menu(); },
      '[data-film]': () => startReplay(REC.last, () => this.debriefAgain(r)),
      '[data-save]': (e, el) => { const er = REC.save(); toast(er || 'Záznam uložen do Filmového archivu.'); if (!er) el.disabled = true; },
      '[data-again]': () => fly(GAME.lastSpec),
      '[data-retry]': () => { GAME.state = 'menu'; CAREER.retry(c); const spec = CAREER.nextMission(c); this.briefing(spec, () => this.careerHome(c)); },
    });
    this.lastDebrief = s.innerHTML; this.lastDebriefR = r; this.lastAwards = cr && cr.awards ? cr.awards : null;
    try { drawFateScene($('#fatepic'), r); } catch (e) { console.warn(e); }
  },
  debriefAgain(r) { // after a replay, show the same report again without re-applying the career result
    GAME.state = 'debrief';
    const s = this.set(this.lastDebrief);
    try { drawFateScene($('#fatepic'), r); } catch (e) { console.warn(e); }
    const c = store.data.careers.find((x) => x.id === GAME.careerId);
    this.bind(s, {
      '[data-cont]': () => { if (r.mode === 'career' && c) { GAME.state = 'menu'; DEMO.start(); const aw = (this.lastAwards || []); this.lastAwards = null; if (aw.length) this.ceremony(c, aw, 0, () => this.careerHome(c)); else this.careerHome(c); } else this.menu(); },
      '[data-film]': () => startReplay(REC.last, () => this.debriefAgain(r)),
      '[data-save]': (e, el) => { const er = REC.save(); toast(er || 'Záznam uložen.'); if (!er) el.disabled = true; },
      '[data-again]': () => fly(GAME.lastSpec),
      '[data-retry]': () => { if (!c) return; GAME.state = 'menu'; CAREER.retry(c); this.briefing(CAREER.nextMission(c), () => this.careerHome(c)); },
    });
  },
  replayBar() {
    const b = $('#replaybar'); b.hidden = false;
    const o = PLAY.followObj();
    b.innerHTML = `<button class="btn small" data-x>Zpět</button>
      <button class="btn small primary" data-pp>${PLAY.paused ? 'Přehrát' : 'Pauza'}</button>
      <div class="chips">${[0.25, 1, 2, 4].map((v) => `<button class="chip" data-sp="${v}" aria-pressed="${PLAY.speed === v}">${v === 0.25 ? '¼×' : v + '×'}</button>`).join('')}</div>

/* ---------- editor → mission spec ---------- */
function editorSpec(m) {
  const gt = m.target ? targetById(m.target) : null;
  const groups = [];
  const pRole = m.side === 'RAF' ? 'fighter' : isBomberKey(m.player) ? (m.player === 'ju87' ? 'dive' : 'bomber') : (m.groups.some((g) => g.side === 'LW' && ['bomber', 'dive', 'jabo'].includes(g.role)) ? 'escort' : 'fighter');

  else { rs = { x: 0, z: 2000 }; ip = { x: 0, z: -9000 }; }
  const posFor = (side, role, i) => {
    if (side === 'LW') return { x: rs.x + i * 450 - 600, z: rs.z + (role === 'escort' ? 700 : 0) + i * 200 };
    return { x: ip.x + (i % 2 ? 1 : -1) * (2500 + i * 600), z: ip.z - 1500 };
  };
  const pPos = posFor(m.side, pRole, 0);

  if (!gt || m.side === 'RAF') pg.heading = headingTo(pg.x, pg.z, m.side === 'RAF' ? rs.x : ip.x, m.side === 'RAF' ? rs.z : ip.z);
  if (m.player === 'bf110' && pRole === 'escort' && m.groups.some((g) => g.role === 'jabo')) pg.role = 'escort';
  groups.push(pg);
  m.groups.forEach((g, i) => {
    const p = posFor(g.side, g.role, i + 1);
    const gg = { side: g.side, key: g.key, n: g.n, role: g.role, alt: g.alt, x: p.x, z: p.z, bombs: g.role === 'jabo' ? [250, 250] : undefined };
    if (!gt || g.side === 'RAF' || g.role === 'fighter') gg.heading = headingTo(p.x, p.z, g.side === 'RAF' ? rs.x : ip.x, g.side === 'RAF' ? rs.z : ip.z);
    if (!gt && (g.role === 'bomber' || g.role === 'dive' || g.role === 'jabo')) gg.role = 'fighter';
    groups.push(gg);
  });

  if (gt) objective = m.side === 'RAF' ? 'intercept' : ['bomber', 'dive', 'jabo'].includes(pRole) ? 'bomb' : pRole === 'escort' ? 'escort' : 'sweep';
  return { mode: 'custom', title: m.name, day: m.day, time: m.time, clouds: m.clouds, target: gt ? gt.id : null, objective, groups, briefing: `Vlastní mise z editoru. ${gt ? 'Cíl: ' + gt.name + '.' : 'Bez pozemního cíle, rozhodne vzdušný souboj.'}` };
}

  let fxDt = dt;
  if (GAME.state === 'fly') {
    const p = W.player;
    if (CTRL.timeScale > 1 && p && !p.bailed && timeThreat(p)) { CTRL.timeScale = 1; HUD.msg('Nepřítel na dostřel, čas běží normálně.', 'bad'); }

      ACC += dt * CTRL.timeScale * (store.data.settings.tempo || 1); let n = 0;
      const maxN = Math.max(16, Math.ceil(CTRL.timeScale * 4));
      while (ACC >= STEP && n < maxN) { simStep(STEP); REC.tick(STEP); ACC -= STEP; n++; }
      if (n >= maxN) ACC = 0;

    } else fxDt = CTRL.paused ? 0 : dt;
    for (const pl of W.planes) pl.syncMesh();

  } else if (GAME.state === 'replay') {
    PLAY.update(dt); fxDt = PLAY.paused ? 0 : dt * PLAY.speed;
    const sl = $('#rpt'); if (sl && !PLAY.paused) { sl.value = PLAY.t; }
    const tt = $('#rptt'); if (tt) { const t = PLAY.t - PLAY.t0; tt.textContent = `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`; }

    if (n >= 6) ACC = 0;

  // elevator: a tap gives an immediate small, precise nudge; holding builds up to full deflection
  if (pT) { if (!kb.pHeld || Math.sign(kb.pv || 0) !== Math.sign(pT)) kb.pv = 0.32 * Math.sign(pT); kb.pv = clamp(kb.pv + Math.sign(pT) * 1.8 * dt, -1, 1); } else kb.pv = 0;
  const pullT = kb.pv; // -1..1, positive = nose up
  const ff = Math.min(1, Math.abs(sb) * 1.4);
  const n = clamp(nBank + Math.max(0, pullT) * ff * (nMax - nBank), 1, nMax);
  const turn = Math.sign(sb) * G * Math.sqrt(Math.max(0, n * n - 1)) / Math.max(p.speed, 30) * (Math.abs(cb) > 0.05 ? 1 : 0);
  p.assist = { turn, nx: n - 1 };
  // pitch: with up/down the nose moves (in a bank mostly as extra turn), without it the climb angle is held
  let pitch;
  if (pT) { kb.pHeld = true; pitch = pullT * (1 - ff * 0.85); kb.fpa = fpa; }
  else {
    if (kb.pHeld) { kb.pHeld = false; kb.fpa = fpa; }
    if (Math.abs(bank) > 1.6) kb.fpa = fpa; // inverted: just keep the nose where it is
    // engine out or throttle closed: trade height for speed and hold a safe gliding speed
    const vbest = s.vstall * 1.55, thrustless = p.enginePower() < 0.05 || p.throttle < 0.05;
    const hAG = p.pos.y - Math.max(0, groundAt(p.pos.x, p.pos.z));
    if (thrustless) kb.fpa = clamp(-0.075 + (p.speed - vbest) * 0.012, -0.35, 0.03);
    else if (p.speed < s.vstall * 1.2) kb.fpa = Math.min(kb.fpa, (p.speed - s.vstall * 1.1) * 0.02);
    // round out just above the ground (field, water or runway) so a hands-off touchdown is gentle
    if ((thrustless || p.gearDown || p.flaps) && hAG < 22) kb.fpa = Math.max(kb.fpa, -0.012 - hAG * 0.003);
    pitch = clamp((kb.fpa - fpa) * 3.5 / maxPr / Math.max(0.35, Math.abs(cb)), -1, 1) * Math.sign(cb || 1);
  }
  p.ctrl.pitch = clamp(pitch, -1, 1); p.ctrl.roll = roll; p.ctrl.yaw = clamp(C.cy + rT * (Math.abs(bank) < 0.3 ? 0.45 : 0.12), -1, 1);
}
